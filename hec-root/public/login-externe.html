<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
		<meta name="viewport" content="width=device-width,height=device-height initial-scale=1">

		<link href="res/css/fonts.css?_cb=4" type="text/css" rel="stylesheet" media="all"/>
		<link href="res/css/login-externe.css?_cb=4" type="text/css" rel="stylesheet" media="all"/>
		<link href="res/css/mobile.css?_cb=4" type="text/css" rel="stylesheet" media="all"/>

		<title>ZoneCours - Login courriel externe</title>

		<script src="/res/js/lib/jquery-1.10.2.min.js"></script>

		<script src="/res/js/index.js?_cb=4"></script>
	</head>

	<body>
		<div class="message" style="display: none;">
			<div class="title"></div>
			<div class="body"></div>
		</div>

				<div class="form">
					<div class="brand">
						<img src="res/images/logo-full.png" alt="HEC Montr&eacute;al" />

						<div class="clear-fix"></div>

						<div class="words dark">
							<div>Apprendre</div>
							<div>Collaborer</div>
							<div>Cr&eacute;er</div>
						</div>
					</div>

					<form id="login-form" method="post" action="/portal/xlogin" enctype="application/x-www-form-urlencoded">
						<div class="login" style="display: none;">
							<div>
								<input name="eid" type="text" placeholder="Courriel" aria-label="Courriel" />
							</div>
							<div>
								<input name="pw" type="password" placeholder="Mot de passe" aria-label="Mot de passe" autocomplete="new-password" />
							</div>
							<div>
								<div class="do-login">
									<button type="submit">Se connecter</button>
								</div>
							</div>
						</div>

						<div class="loading">
							<img src="/res/images/loading.gif" alt="Chargement" />
						</div>
					</form>
					
					<div class="footer">
						<div class="problem">
							<a href="/connexionInfo-fr.html">Probl&egrave;me de connexion?</a>
						</div>
						<div class="governance">
							En utilisant les ressources informationnelles de HEC&nbsp;Montréal, je m'engage à respecter le <a href="https://www.hec.ca/reglement-ressources-informationnelles">R&egrave;glement sur l'utilisation des ressources informationnelles</a>
						</div>
						<div class="help-link">
							<a href="http://www.hec.ca">HEC Montr&eacute;al</a>
							<a class="help-link" href="https://hecmontreal.atlassian.net/l/c/eT0Ve1Lu">AIDE</a>
							<a href="/login-external.html">English</a>
						</div>
					</div>
				</div>
	</body>
</html>
